<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page Not Found | Muhannad Rafi H. Alqarni</title>
    <meta name="description" content="The page you're looking for doesn't exist. Return to the portfolio of Muhannad Rafi H. Alqarni.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/assets/images/icone.png">
    <link rel="canonical" href="https://muhannadrafi.com/">
    <!-- Sync theme before paint to prevent FOUC -->
    <script src="/assets/js/theme-init.js"></script>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        /* 404-specific layout — centred, full-viewport */
        .not-found-wrap {
            display: grid;
            place-items: center;
            min-height: 100dvh;
            padding: 32px 24px;
            text-align: center;
        }
        .not-found {
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }
        .not-found__code {
            font-size: clamp(96px, 18vw, 148px);
            font-weight: 800;
            letter-spacing: -0.06em;
            line-height: 1;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 0 4px;
            user-select: none;
            position: relative;
        }
        .not-found__code::after {
            content: "404";
            position: absolute;
            inset: 0;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(28px);
            opacity: .35;
            z-index: -1;
        }
        .not-found__icon {
            font-size: 40px;
            margin-bottom: 20px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-10px); }
        }
        .not-found__title {
            font-size: clamp(20px, 4vw, 26px);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 0 0 14px;
            color: var(--ink);
        }
        .not-found__body {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
            margin: 0 0 32px;
        }
        .not-found__actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .not-found__links {
            margin-top: 36px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
            justify-content: center;
            font-size: 12px;
            color: var(--muted);
        }
        .not-found__links a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: opacity var(--transition);
        }
        .not-found__links a:hover { opacity: .75; }
        .not-found__divider {
            width: 48px; height: 2px;
            background: var(--accent-grad);
            border-radius: 2px;
            margin: 28px auto;
        }
        @media (prefers-reduced-motion: reduce) {
            .not-found__icon { animation: none; }
            .not-found__code::after { filter: none; opacity: .2; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- Minimal sticky header, consistent with portfolio -->
    <header class="site-header" style="position:relative;">
        <div class="container">
            <div class="topbar">
                <a class="brand" href="/" aria-label="Muhannad Rafi homepage">
                    <span class="brand__mark">MR</span>
                    <span class="brand__text">Muhannad Rafi</span>
                </a>
                <div class="topbar__actions">
                    <button class="theme-toggle" id="themeToggle" title="Toggle dark mode" type="button" aria-label="Toggle dark mode">
                        <span class="theme-toggle__sun" aria-hidden="true">☀</span>
                        <span class="theme-toggle__moon" aria-hidden="true">◐</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main id="main-content">
        <div class="not-found-wrap">
            <div class="not-found">
                <span class="not-found__icon" aria-hidden="true">🗺</span>
                <p class="not-found__code" aria-label="Error 404">404</p>
                <h1 class="not-found__title">Page not found</h1>
                <p class="not-found__body">
                    The page you're looking for doesn't exist, may have moved,
                    or was never here to begin with.
                </p>
                <div class="not-found__actions">
                    <a class="button button--primary" href="/">← Back to Portfolio</a>
                    <a class="button button--secondary" href="/#contact">Get in touch</a>
                </div>
                <div class="not-found__divider" aria-hidden="true"></div>
                <nav class="not-found__links" aria-label="Quick links">
                    <a href="/#about">About</a>
                    <a href="/#experience">Experience</a>
                    <a href="/#skills">Skills</a>
                    <a href="/#certifications">Certifications</a>
                    <a href="/#contact">Contact</a>
                </nav>
            </div>
        </div>
    </main>

    <script src="/assets/js/main.js" defer></script>
</body>
</html>
